<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">
  <!-- L = (a + b) · c: values and gradients. Inputs a = 2, b = 1, c = −2. -->
  <rect width="760" height="385" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="fwdbig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <line x1="178" y1="89.0" x2="221.2272624669019" y2="142.84448482719358" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="178" y1="239.0" x2="222.1274546571475" y2="177.84089617693593" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="440" y1="160.0" x2="488.83432421819526" y2="205.07783773987256" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="440" y1="279.0" x2="488.70998309020644" y2="234.78632304119722" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="255" y1="160" x2="297" y2="160.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="525" y1="220" x2="567" y2="220.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <rect x="12" y="40" width="166" height="98" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="24" y="64" font-weight="600">a</text><text x="24" y="86">value 2</text><text x="24" y="108" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#c2410c">∂L/∂a = ∂L/∂d · ∂d/∂a</tspan></text><text x="24" y="127" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#64748b">= </tspan><tspan fill="#c2410c">−2</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#7c3aed">1</tspan><tspan fill="#64748b"> = </tspan><tspan fill="#c2410c">−2</tspan></text>
  <rect x="12" y="190" width="166" height="98" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="24" y="214" font-weight="600">b</text><text x="24" y="236">value 1</text><text x="24" y="258" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#c2410c">∂L/∂b = ∂L/∂d · ∂d/∂b</tspan></text><text x="24" y="277" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#64748b">= </tspan><tspan fill="#c2410c">−2</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#7c3aed">1</tspan><tspan fill="#64748b"> = </tspan><tspan fill="#c2410c">−2</tspan></text>
  <rect x="300" y="111" width="140" height="98" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="312" y="135" font-weight="600">d = a + b</text><text x="312" y="157">value 3</text><text x="312" y="179" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#c2410c">∂L/∂d = </tspan><tspan fill="#c2410c">1</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#7c3aed">(−2)</tspan><tspan fill="#c2410c"> = −2</tspan></text>
  <rect x="300" y="230" width="140" height="98" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="312" y="254" font-weight="600">c</text><text x="312" y="276">value −2</text><text x="312" y="298" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#c2410c">∂L/∂c = </tspan><tspan fill="#c2410c">1</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#7c3aed">3</tspan><tspan fill="#c2410c"> = 3</tspan></text>
  <rect x="570" y="171" width="140" height="98" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="582" y="195" font-weight="600">L = d · c</text><text x="582" y="217">value −6</text><text x="582" y="239" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#c2410c">∂L/∂L = 1</tspan></text><text x="582" y="258" font-size="13" font-weight="600" xml:space="preserve"><tspan fill="#64748b">start here</tspan></text>
  <circle cx="235" cy="160" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="235" y="166" text-anchor="middle" font-size="18">+</text>
  <circle cx="505" cy="220" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="505" y="226" text-anchor="middle" font-size="18">×</text>
  <g fill="#7c3aed" font-size="13"><text x="196" y="104">∂d/∂a = 1</text><text x="196" y="232">∂d/∂b = 1</text><text x="452" y="150">∂L/∂d = c = −2</text><text x="478" y="272">∂L/∂c = d = 3</text></g>
  <line x1="700" y1="355" x2="60" y2="355" stroke="#c2410c" stroke-width="2" marker-end="url(#back)"/>
  <text x="380" y="348" text-anchor="middle" fill="#c2410c">backward, against the arrows: start with 1 at L, multiply by the local derivatives on the edges</text>
</svg>
