<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">
  <!-- L = (a + b) · c: forward values. Inputs a = 2, b = 1, c = −2. -->
  <rect width="760" height="385" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="fwdbig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <line x1="170" y1="79.0" x2="220.14441052183406" y2="133.77312533923413" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="170" y1="229.0" x2="221.02197952594798" y2="166.988671037694" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="440" y1="150.0" x2="488.83432421819526" y2="195.07783773987256" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="440" y1="269.0" x2="488.70998309020644" y2="224.78632304119722" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="255" y1="150" x2="297" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="525" y1="210" x2="567" y2="210.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#fwd)"/>
  <rect x="30" y="40" width="140" height="78" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="42" y="64" font-weight="600">a</text><text x="42" y="86">value 2</text>
  <rect x="30" y="190" width="140" height="78" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="42" y="214" font-weight="600">b</text><text x="42" y="236">value 1</text>
  <rect x="300" y="111" width="140" height="78" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="312" y="135" font-weight="600">d = a + b</text><text x="312" y="157">value 3</text>
  <rect x="300" y="230" width="140" height="78" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="312" y="254" font-weight="600">c</text><text x="312" y="276">value −2</text>
  <rect x="570" y="171" width="140" height="78" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="582" y="195" font-weight="600">L = d · c</text><text x="582" y="217">value −6</text>
  <circle cx="235" cy="150" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="235" y="156" text-anchor="middle" font-size="18">+</text>
  <circle cx="505" cy="210" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><text x="505" y="216" text-anchor="middle" font-size="18">×</text>
  <line x1="60" y1="362" x2="700" y2="362" stroke="#64748b" stroke-width="2" marker-end="url(#fwdbig)"/>
  <text x="380" y="348" text-anchor="middle" fill="#64748b">forward: compute values from the inputs to L</text>
</svg>
