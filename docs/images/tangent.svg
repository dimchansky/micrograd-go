  <line x1="516.0" y1="312" x2="580.0" y2="312" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a-pos)"/>
  <g text-anchor="middle">
    <text x="345" y="84" fill="#2563eb" font-weight="600">at x = 1: slope f′(1) = −2</text>
    <text x="345" y="102" fill="#2563eb">tangent goes down, so f grows to the left</text>
    <text x="345" y="134" fill="#c2410c" font-weight="600">at x = 3.5: slope f′(3.5) = +3</text>
    <text x="345" y="152" fill="#c2410c">tangent goes up, so f grows to the right</text>
  </g>
  <text x="360" y="395" text-anchor="middle" fill="#475569">Arrows: the direction to move x to increase f. It always points the same way as the sign of the slope.</text>
</svg>
